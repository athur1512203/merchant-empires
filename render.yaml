services:
  - type: web
    name: merchant-empires-api
    runtime: node
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run db:generate && npm run typecheck
    startCommand: npm run server:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
